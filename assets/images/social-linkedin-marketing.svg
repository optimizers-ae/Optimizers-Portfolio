<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760">
  <defs>
    <linearGradient id="linkedinAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2867B2"/>
      <stop offset="1" stop-color="#087C96"/>
    </linearGradient>
    <radialGradient id="burgundyGlow" cx="1" cy="1" r="1">
      <stop offset="0" stop-color="#7D0414" stop-opacity=".30"/>
      <stop offset="1" stop-color="#7D0414" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Main editable card -->
  <rect x="28" y="28" width="664" height="704" rx="34" fill="#060A0D" stroke="#26343B" stroke-width="2"/>
  <ellipse cx="650" cy="690" rx="300" ry="190" fill="url(#burgundyGlow)"/>

  <!-- LinkedIn header -->
  <rect x="57" y="69" width="68" height="68" rx="13" fill="url(#linkedinAccent)"/>
  <g transform="translate(74 86) scale(1.5)" fill="#FFFFFF">
    <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93zM6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37z"/>
  </g>

  <text x="151" y="101" fill="#F7F7F5" font-family="Open Sans, Arial, sans-serif" font-size="25" font-weight="700">Your Business</text>
  <text x="151" y="128" fill="#93A1A8" font-family="Open Sans, Arial, sans-serif" font-size="17">linkedin.com/company/yourbusiness</text>

  <!-- LinkedIn post -->
  <rect x="58" y="166" width="604" height="208" rx="20" fill="#0D1A21" stroke="#26343B" stroke-width="1.5"/>

  <!-- Profile circle -->
  <circle cx="99" cy="214" r="23" fill="#2867B2"/>
  <circle cx="99" cy="214" r="9" fill="#F7F7F5"/>

  <!-- Post text -->
  <rect x="142" y="198" width="350" height="9" rx="4.5" fill="#34444C"/>
  <rect x="142" y="220" width="220" height="8" rx="4" fill="#26343B"/>
  <rect x="78" y="252" width="548" height="9" rx="4.5" fill="#34444C"/>
  <rect x="78" y="274" width="490" height="9" rx="4.5" fill="#26343B"/>
  <rect x="78" y="296" width="330" height="9" rx="4.5" fill="#00B0D5"/>

  <!-- Engagement row -->
  <path d="M79 340l9-5 9 5-3 10h-12z" fill="#2867B2"/>
  <text x="108" y="348" fill="#93A1A8" font-family="Open Sans, Arial, sans-serif" font-size="14">842</text>
  <rect x="172" y="338" width="14" height="12" rx="2" fill="#61747D"/>
  <text x="197" y="348" fill="#93A1A8" font-family="Open Sans, Arial, sans-serif" font-size="14">96</text>

  <!-- Divider -->
  <line x1="58" y1="400" x2="662" y2="400" stroke="#26343B" stroke-width="2"/>

  <!-- Metrics -->
  <g font-family="Open Sans, Arial, sans-serif">
    <text x="151" y="450" text-anchor="middle" fill="#F7F7F5" font-size="30" font-weight="700">32K</text>
    <text x="151" y="475" text-anchor="middle" fill="#93A1A8" font-size="14" letter-spacing=".4">IMPRESSIONS</text>

    <text x="360" y="450" text-anchor="middle" fill="#F7F7F5" font-size="30" font-weight="700">7.2K</text>
    <text x="360" y="475" text-anchor="middle" fill="#93A1A8" font-size="14" letter-spacing=".4">FOLLOWERS</text>

    <text x="569" y="450" text-anchor="middle" fill="#2867B2" font-size="30" font-weight="700">5.1%</text>
    <text x="569" y="475" text-anchor="middle" fill="#93A1A8" font-size="14" letter-spacing=".4">ENG. RATE</text>
  </g>

  <!-- CTA buttons -->
  <rect x="58" y="514" width="292" height="70" rx="13" fill="url(#linkedinAccent)"/>
  <text x="204" y="557" text-anchor="middle" fill="#F7F7F5" font-family="Open Sans, Arial, sans-serif" font-size="20" font-weight="700">Follow</text>

  <rect x="370" y="514" width="292" height="70" rx="13" fill="#101A20" stroke="#293940" stroke-width="2"/>
  <text x="516" y="557" text-anchor="middle" fill="#F7F7F5" font-family="Open Sans, Arial, sans-serif" font-size="20" font-weight="600">Message</text>

  <circle cx="632" cy="690" r="5" fill="#7D0414"/>
  <circle cx="648" cy="690" r="5" fill="#00B0D5"/>
</svg>
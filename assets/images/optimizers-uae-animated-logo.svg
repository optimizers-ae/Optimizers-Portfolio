<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" role="img" aria-labelledby="title desc">
  <title id="title">Optimizers United Arab Emirates</title>
  <desc id="desc">Animated Optimizers UAE logo with rotating arrows and sliding wordmark.</desc>
  <style>
    .part{transform-box:fill-box;transform-origin:center}
    .outer{animation:outer 8s cubic-bezier(.16,1,.3,1) infinite}
    .inner{animation:inner 8s cubic-bezier(.16,1,.3,1) infinite}
    .core{animation:core 8s cubic-bezier(.16,1,.3,1) infinite}
    .line1{animation:line1 8s cubic-bezier(.16,1,.3,1) infinite}
    .line2{animation:line2 8s cubic-bezier(.16,1,.3,1) infinite}
    .word{fill:#fff;font-family:'Open Sans',Arial,sans-serif;font-weight:700;letter-spacing:-1.2px}
    @keyframes outer{0%,5%{opacity:0;transform:rotate(-90deg)}17%,86%{opacity:1;transform:rotate(0)}94%,100%{opacity:0;transform:rotate(-14deg)}}
    @keyframes inner{0%,7.5%{opacity:0;transform:rotate(-90deg)}19%,86%{opacity:1;transform:rotate(0)}94%,100%{opacity:0;transform:rotate(-14deg)}}
    @keyframes core{0%,11%{opacity:0}21%,86%{opacity:1}94%,100%{opacity:0}}
    @keyframes line1{0%,11.5%{opacity:0;transform:translateX(-330px) skewX(-9deg)}21.5%,86%{opacity:1;transform:none}94%,100%{opacity:0;transform:translateX(35px)}}
    @keyframes line2{0%,14.5%{opacity:0;transform:translateX(-380px) skewX(-9deg)}24.5%,86%{opacity:1;transform:none}94%,100%{opacity:0;transform:translateX(35px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
  </style>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1116"/>
      <stop offset="1" stop-color="#071016"/>
    </linearGradient>
    <linearGradient id="chatGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#128C7E"/>
      <stop offset="1" stop-color="#25D366"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#128C7E"/>
      <stop offset="1" stop-color="#25D366"/>
    </linearGradient>
    <radialGradient id="burgundyGlow" cx="1" cy="1" r="1">
      <stop offset="0" stop-color="#7D0414" stop-opacity=".32"/>
      <stop offset="1" stop-color="#7D0414" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity=".34"/>
    </filter>
  </defs>

  <!-- Main editable card -->
  <rect x="28" y="28" width="664" height="664" rx="34" fill="url(#panel)" stroke="#26343B" stroke-width="2"/>
  <ellipse cx="650" cy="655" rx="300" ry="190" fill="url(#burgundyGlow)"/>

  <!-- Header -->
  <circle cx="91" cy="103" r="34" fill="#25D366"/>
  <g transform="translate(72 84) scale(1.58)">
    <path fill="#FFFFFF" d="M19.05 4.91A9.82 9.82 0 0 0 12.04 2c-5.46 0-9.91 4.45-9.91 9.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91c0-2.65-1.03-5.14-2.9-7.01m-7.01 15.24c-1.48 0-2.93-.4-4.2-1.15l-.3-.18l-3.12.82l.83-3.04l-.2-.31a8.26 8.26 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24c2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c.02 4.54-3.68 8.23-8.22 8.23m4.52-6.16c-.25-.12-1.47-.72-1.69-.81c-.23-.08-.39-.12-.56.12c-.17.25-.64.81-.78.97c-.14.17-.29.19-.54.06c-.25-.12-1.05-.39-1.99-1.23c-.74-.66-1.23-1.47-1.38-1.72c-.14-.25-.02-.38.11-.51c.11-.11.25-.29.37-.43s.17-.25.25-.41c.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31c-.22.25-.86.85-.86 2.07s.89 2.4 1.01 2.56c.12.17 1.75 2.67 4.23 3.74c.59.26 1.05.41 1.41.52c.59.19 1.13.16 1.56.1c.48-.07 1.47-.6 1.67-1.18c.21-.58.21-1.07.14-1.18s-.22-.16-.47-.28"/>
  </g>

  <text x="143" y="101" fill="#F7F7F5" font-family="Open Sans, Arial, sans-serif" font-size="25" font-weight="700">Your Business</text>
  <text x="143" y="128" fill="#93A1A8" font-family="Open Sans, Arial, sans-serif" font-size="17">wa.me/971XXXXXXXXX</text>

  <!-- Chat area -->
  <rect x="58" y="166" width="604" height="228" rx="24" fill="#0D1A21" stroke="#26343B" stroke-width="1.5"/>

  <!-- Incoming bubble -->
  <rect x="91" y="199" width="420" height="67" rx="17" fill="#13242D" stroke="#293940" stroke-width="1.5"/>
  <rect x="118" y="221" width="290" height="8" rx="4" fill="#61747D"/>
  <rect x="118" y="240" width="205" height="8" rx="4" fill="#61747D"/>

  <!-- Outgoing bubble -->
  <rect x="247" y="284" width="348" height="76" rx="18" fill="#10323C" stroke="#128C7E" stroke-width="1.5"/>
  <rect x="275" y="308" width="265" height="8" rx="4" fill="#25D366"/>
  <rect x="275" y="328" width="170" height="8" rx="4" fill="#128C7E"/>
  <path d="M555 341l8 7 13-16" fill="none" stroke="#25D366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M563 341l8 7 13-16" fill="none" stroke="#25D366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Divider -->
  <line x1="58" y1="429" x2="662" y2="429" stroke="#26343B" stroke-width="2"/>

  <!-- Metrics -->
  <g font-family="Open Sans, Arial, sans-serif">
    <text x="151" y="480" text-anchor="middle" fill="#F7F7F5" font-size="30" font-weight="700">99%</text>
    <text x="151" y="505" text-anchor="middle" fill="#93A1A8" font-size="14" letter-spacing=".4">OPEN RATE</text>

    <text x="360" y="480" text-anchor="middle" fill="#F7F7F5" font-size="30" font-weight="700">3.6K</text>
    <text x="360" y="505" text-anchor="middle" fill="#93A1A8" font-size="14" letter-spacing=".4">CHATS</text>

    <text x="569" y="480" text-anchor="middle" fill="#25D366" font-size="30" font-weight="700">45%</text>
    <text x="569" y="505" text-anchor="middle" fill="#93A1A8" font-size="14" letter-spacing=".4">REPLY RATE</text>
  </g>

  <!-- Buttons -->
  <rect x="58" y="538" width="292" height="70" rx="13" fill="url(#button)"/>
  <text x="204" y="581" text-anchor="middle" fill="#F7F7F5" font-family="Open Sans, Arial, sans-serif" font-size="20" font-weight="700">Chat Now</text>

  <rect x="370" y="538" width="292" height="70" rx="13" fill="#101A20" stroke="#293940" stroke-width="2"/>
  <text x="516" y="581" text-anchor="middle" fill="#F7F7F5" font-family="Open Sans, Arial, sans-serif" font-size="20" font-weight="600">Save Contact</text>

  <!-- Small accent -->
  <circle cx="632" cy="653" r="5" fill="#7D0414"/>
  <circle cx="648" cy="653" r="5" fill="#25D366"/>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="403" height="531" viewBox="0 0 403 531" role="img" aria-labelledby="title desc">
  <title id="title">Optimizers brand identity kit card</title>
  <desc id="desc">An editable Optimizers-themed brand identity kit preview showing logo, palette, typography, statistics, and call-to-action buttons.</desc>

  <defs>
    <linearGradient id="background" x1="8" y1="4" x2="396" y2="525" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060A0D"/>
      <stop offset="0.56" stop-color="#0A1116"/>
      <stop offset="1" stop-color="#071016"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(393 35) rotate(140) scale(190 175)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00B0D5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00B0D5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="burgundyGlow" cx="0" cy="0" r="1" gradientTransform="translate(12 513) rotate(-42) scale(245 225)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7D0414" stop-opacity="0.58"/>
      <stop offset="0.48" stop-color="#7D0414" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#7D0414" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconTile" x1="23" y1="23" x2="75" y2="75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00B0D5"/>
      <stop offset="0.52" stop-color="#087C96"/>
      <stop offset="1" stop-color="#7D0414"/>
    </linearGradient>
    <linearGradient id="showcase" x1="23" y1="98" x2="376" y2="209" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091B23"/>
      <stop offset="0.6" stop-color="#07151B"/>
      <stop offset="1" stop-color="#100C11"/>
    </linearGradient>
    <linearGradient id="typeCard" x1="23" y1="273" x2="376" y2="359" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D181E"/>
      <stop offset="1" stop-color="#091319"/>
    </linearGradient>
    <linearGradient id="secondaryButton" x1="204" y1="469" x2="376" y2="516" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1A20"/>
      <stop offset="1" stop-color="#0A1318"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="0.5" y="0.5" width="402" height="530" rx="18"/>
    </clipPath>
    <style>
      .font { font-family: "Open Sans", Arial, Helvetica, sans-serif; }
      .white { fill: #F7F7F5; }
      .muted { fill: #93A1A8; }
      .cyan { fill: #00B0D5; }
    </style>
  </defs>

  <!-- Artboard -->
  <g clip-path="url(#frameClip)">
    <rect x="0.5" y="0.5" width="402" height="530" rx="18" fill="url(#background)"/>
    <rect x="0.5" y="0.5" width="402" height="530" rx="18" fill="url(#cyanGlow)"/>
    <rect x="0.5" y="0.5" width="402" height="530" rx="18" fill="url(#burgundyGlow)"/>
    <path d="M0 422C89 387 170 422 219 531H0V422Z" fill="#7D0414" opacity="0.07"/>
    <path d="M325 0H403V109C373 81 349 47 325 0Z" fill="#00B0D5" opacity="0.035"/>
  </g>
  <rect x="0.5" y="0.5" width="402" height="530" rx="18" fill="none" stroke="#26343B"/>

  <!-- Header -->
  <circle cx="49" cy="49" r="26" fill="url(#iconTile)"/>
  <circle cx="49" cy="49" r="22" fill="none" stroke="#A5EEF7" stroke-opacity="0.24"/>
  <g transform="translate(37 37)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="M12.077 20H7V4h11v14h-5.077"/>
  </g>
  <text class="font white" x="90" y="45" font-size="19" font-weight="700">Brand Identity Kit</text>
  <text class="font muted" x="90" y="68" font-size="14.5">Logo · Palette · Typography</text>

  <!-- Logo showcase -->
  <rect x="23" y="98" width="353" height="111" rx="13" fill="url(#showcase)" stroke="#293940"/>
  <circle cx="200" cy="153.5" r="34" fill="#00B0D5" opacity="0.055" filter="url(#softGlow)"/>
  <rect x="176.7" y="130.2" width="46.6" height="46.6" rx="9" transform="rotate(45 200 153.5)" fill="#07151B" stroke="#00B0D5" stroke-width="2.7"/>
  <rect x="187" y="140.5" width="26" height="26" rx="5" transform="rotate(45 200 153.5)" fill="none" stroke="#F7F7F5" stroke-opacity="0.22"/>
  <circle cx="200" cy="153.5" r="3.2" fill="#7D0414"/>

  <!-- Brand palette -->
  <rect x="23" y="223" width="82" height="35" rx="7" fill="#07141A" stroke="#2A3A41"/>
  <rect x="112" y="223" width="83" height="35" rx="7" fill="#00B0D5"/>
  <rect x="202" y="223" width="83" height="35" rx="7" fill="#7D0414"/>
  <rect x="292" y="223" width="84" height="35" rx="7" fill="#F7F7F5" stroke="#D8E1E4" stroke-opacity="0.38"/>
  <path d="M119 228H187" stroke="#8BE5F3" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M209 228H277" stroke="#D04A5E" stroke-width="2" stroke-linecap="round" opacity="0.48"/>

  <!-- Typography preview -->
  <rect x="23" y="273" width="353" height="86" rx="13" fill="url(#typeCard)" stroke="#27373E"/>
  <g transform="translate(40 291) scale(.12)" fill="#00B0D5">
    <path d="M85.43 53.45a6 6 0 0 0-10.86 0l-64 136a6 6 0 1 0 10.86 5.11L38.63 158h82.74l17.2 36.55a6 6 0 1 0 10.86-5.11ZM44.28 146L80 70.09L115.72 146ZM200 98c-12.21 0-21.71 3.28-28.23 9.74a6 6 0 0 0 8.46 8.52c4.18-4.15 10.84-6.26 19.77-6.26c14.34 0 26 9.87 26 22v7.24a40.36 40.36 0 0 0-26-9.24c-20.95 0-38 15.25-38 34s17.05 34 38 34a40.36 40.36 0 0 0 26-9.24V192a6 6 0 0 0 12 0v-60c0-18.75-17-34-38-34m0 88c-14.34 0-26-9.87-26-22s11.66-22 26-22s26 9.87 26 22s-11.66 22-26 22"/>
  </g>
  <rect x="40" y="323" width="318" height="7" rx="3.5" fill="#93A1A8" opacity="0.31"/>
  <rect x="40" y="337" width="191" height="7" rx="3.5" fill="#93A1A8" opacity="0.18"/>

  <!-- Divider -->
  <path d="M23 379.5H376" stroke="#2A3940"/>

  <!-- Statistics -->
  <g class="font">
    <text class="white" x="24" y="421" font-size="23" font-weight="700">100%</text>
    <text class="white" x="201.5" y="421" text-anchor="middle" font-size="23" font-weight="700">3</text>
    <text class="cyan" x="376" y="421" text-anchor="end" font-size="23" font-weight="700">5+</text>
    <text class="muted" x="24" y="446" font-size="12.5">CUSTOM</text>
    <text class="muted" x="201.5" y="446" text-anchor="middle" font-size="12.5">CONCEPTS</text>
    <text class="muted" x="376" y="446" text-anchor="end" font-size="12.5">BRAND ASSETS</text>
  </g>

  <!-- Buttons -->
  <rect x="23" y="469" width="172" height="47" rx="9" fill="#F7F7F5"/>
  <rect x="204" y="469" width="172" height="47" rx="9" fill="url(#secondaryButton)" stroke="#66747A"/>
  <g class="font" font-size="14" font-weight="700">
    <text x="109" y="498.5" text-anchor="middle" fill="#060A0D">Start Branding</text>
    <text x="290" y="498.5" text-anchor="middle" fill="#F7F7F5">View Portfolio</text>
  </g>
</svg>
